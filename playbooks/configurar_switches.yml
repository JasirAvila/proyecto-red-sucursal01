---
- name: Aprovisionamiento y Respaldos de la Sucursal 01
  hosts: switches_cisco
  gather_facts: no
  vars_files:
    - ../variables/sucursal_01.yml

  tasks:
    - name: 1. Crear carpetas de respaldos locales
      delegate_to: localhost
      file:
        path: "../respaldos"
        state: directory

    - name: 2. Configurar Nombres de VLANs
      cisco.ios.ios_vlans:
        config:
          - name: "{{ item.name }}"
            vlan_id: "{{ item.vlan_id }}"
        state: merged
      loop: "{{ vlans }}"

    - name: 3. Configurar Puertos Troncales en SW-SUC-01-CORE
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.interface }}"
            mode: trunk
            trunk:
              native_vlan: "{{ item.native_vlan }}"
              allowed_vlans: "{{ item.allowed_vlans }}"
      loop: "{{ sw_core_interfaces.troncales }}"
      when: inventory_hostname == "SW-SUC-01-CORE"

    - name: 4. Configurar Puertos Troncales en SW-SUC-01-ACC1
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.interface }}"
            mode: trunk
            trunk:
              native_vlan: "{{ item.native_vlan }}"
              allowed_vlans: "{{ item.allowed_vlans }}"
      loop: "{{ sw_acc1_interfaces.troncales }}"
      when: inventory_hostname == "SW-SUC-01-ACC1"

    - name: 5. Configurar Puertos de Acceso en SW-SUC-01-CORE
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.interface }}"
            mode: access
            access:
              vlan: "{{ item.vlan }}"
      loop: "{{ sw_core_interfaces.acceso }}"
      when: inventory_hostname == "SW-SUC-01-CORE"

    - name: 6. Configurar Puertos de Acceso en SW-SUC-01-ACC1
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.interface }}"
            mode: access
            access:
              vlan: "{{ item.vlan }}"
      loop: "{{ sw_acc1_interfaces.acceso }}"
      when: inventory_hostname == "SW-SUC-01-ACC1"

    - name: 7. Guardar configuracion en NVRAM (write memory)
      cisco.ios.ios_config:
        save_when: modified

    - name: 8. Extraer Running Configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: config_evidencia

    - name: 9. Guardar respaldo local en el servidor
      delegate_to: localhost
      copy:
        content: "{{ config_evidencia.stdout[0] }}"
        dest: "../respaldos/{{ inventory_hostname }}_running_config.txt"
